name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-test:
    name: Node 测试 + 治理检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 治理检查（pretest 自动执行，这里显式跑一遍确认）
        run: pnpm run check:governance

      - name: 全量 Node 测试（584+，含 pretest 治理护栏）
        run: pnpm test

  android-test:
    name: Android JVM 测试（GateBcClosure 等）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Android SDK（compileSdk 35）
        uses: android-actions/setup-android@v3

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成 Android 构建资产（校验与入库资产逐字节一致）
        run: |
          node --experimental-strip-types scripts/generate-api-route-registry.mjs
          node --experimental-strip-types scripts/generate-gatebc-assets.mjs

      - name: Android JVM 单元测试
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain
