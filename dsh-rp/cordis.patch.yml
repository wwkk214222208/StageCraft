# dsh-rp bundle patch：把酒馆插件行插入 profile 名单。
# 格式与官方 dsh 插件一致（顶层 YAML 数组，insert 一个插件行）。
# 装好后 `dsh --profile <name>` 启动时会在 RP_PORT（默认 8799）打开酒馆。
# runtimeMode=development 监听本地仓库并自动构建/重载；sandboxed 使用独立 worker，embedded 为常规内嵌运行。
- insert:
    - id: rp
      name: 'dsh-rp'
      config:
        runtimeMode: 'sandboxed'
        port: 8799
        host: '127.0.0.1'
        # 开发机可填写 character-tavern 仓库根目录；填写后启动/热重载自动构建并同步 dist。
        syncRepository: 'D:/AI/AIRP/character-tavern'
        syncOnStart: true
        syncOnReload: true
        watchDebounceMs: 700
