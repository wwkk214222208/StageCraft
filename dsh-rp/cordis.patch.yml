# dsh-rp bundle patch：把酒馆插件行插入 profile 名单。
# 格式与官方 dsh 插件一致（顶层 YAML 数组，insert 一个插件行）。
# 装好后 `dsh --profile <name>` 启动时会在 RP_PORT（默认 8799）打开酒馆。
# runtimeMode=embedded 保持开发期自包含 HTTP；sandboxed 将 StageCraft 放入独立 worker，
# 仅通过版本化 bounded JSON RPC 暴露调试控制，worker 默认不监听 HTTP。
- insert:
    - id: rp
      name: 'dsh-rp'
      config:
        runtimeMode: 'embedded'
        port: 8799
        host: '127.0.0.1'
